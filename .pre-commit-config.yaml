# Mirrors the CI gate in .github/workflows/ci.yml so failures surface locally.
# Install with: uv run pre-commit install
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # First, because it is the only failure here that cannot be undone: once a
      # real subscription id or a real sweep's output is in a commit, git history
      # is permanent and this repository is public.
      - id: no-real-data
        name: refuse real-estate artefacts
        entry: uv run python scripts/check_no_real_data.py
        language: system
        pass_filenames: true

      - id: pyright
        name: pyright (strict on src)
        entry: uv run pyright
        language: system
        pass_filenames: false
        types: [python]

      - id: pytest
        name: pytest with coverage
        entry: uv run pytest
        language: system
        pass_filenames: false
        types: [python]
