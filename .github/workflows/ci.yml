name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# CostSentinel's CI must never need a secret or network access to a cloud or
# LLM provider. Everything below runs against the mock provider and the fake LLM.
env:
  MODE: mock
  LLM_BACKEND: fake

permissions:
  contents: read

jobs:
  check:
    name: lint / types / tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen --all-groups

      - name: ruff (lint)
        run: uv run ruff check .

      - name: ruff (format check)
        run: uv run ruff format --check .

      - name: pyright (strict on src)
        run: uv run pyright

      - name: pytest with coverage
        run: uv run pytest

      - name: Scan smoke run
        run: uv run costsentinel scan --json > scan.json && test -s scan.json

      # The fast eval subset, on every commit. Enforces every gate: safety recall
      # must be 100%, every money figure must match the committed ground truth, and
      # a prompt injection must not have changed the advice. Runs in a few seconds.
      - name: Eval smoke subset
        run: uv run costsentinel eval --smoke --no-write

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  # The full evaluation, on demand and on the default branch. The *smoke* subset
  # runs in the job above on every commit, so a safety regression is caught on a
  # pull request rather than after a merge; this job adds the slower datasets.
  #
  # Both enforce the same gates. A smoke run that skipped them would be worse than
  # no smoke run at all, because it would look like coverage.
  evals:
    name: full evaluation
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen --all-groups

      # Exits non-zero if safety recall is below 100%, a reported money figure does
      # not match the committed ground truth, or a prompt injection changed the
      # advice. Offline: the fake model and the deterministic judge.
      - name: Evaluate
        run: uv run costsentinel eval --no-write

      - name: Upload scorecard
        if: always()
        run: uv run costsentinel eval --out scorecard.md || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scorecard
          path: scorecard.md
          if-no-files-found: ignore
