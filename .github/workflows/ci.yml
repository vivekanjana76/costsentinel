name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# CostSentinel's CI must never need a secret or network access to a cloud or
# LLM provider. Everything below runs against the mock provider and the fake LLM.
env:
  MODE: mock
  LLM_BACKEND: fake

permissions:
  contents: read

jobs:
  check:
    name: lint / types / tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen --all-groups

      - name: ruff (lint)
        run: uv run ruff check .

      - name: ruff (format check)
        run: uv run ruff format --check .

      - name: pyright (strict on src)
        run: uv run pyright

      - name: pytest with coverage
        run: uv run pytest

      - name: Scan smoke run
        run: uv run costsentinel scan --json > scan.json && test -s scan.json

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  # Placeholder for the Phase 5 eval smoke subset. CLAUDE.md section 8 requires
  # CI to gate on it; the job is wired here so enabling it is a one-line change
  # once evals/harness exists.
  evals:
    name: eval smoke (Phase 5)
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "Enabled in Phase 5."
