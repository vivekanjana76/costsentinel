[project]
name = "costsentinel"
version = "0.12.0"
description = "Autonomous multi-agent FinOps governance for multi-subscription Azure estates"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Vivek Anjana" }]

# Phase 1 only. Later phases add their dependencies when their phase starts;
# every addition is flagged in ROADMAP.md first.
dependencies = [
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # A2A v1 Agent Card signing (Phase 12, D129): ES256 JWS over an RFC 8785 canonical
    # form. Default rather than an extra so CI signs and verifies on every run -- a
    # signature path that only exists behind an extra CI never installs is untested.
    # `cryptography` was already in the lock through the Azure extra; `rfc8785` is pure
    # Python with no dependencies.
    "cryptography>=44",
    "rfc8785>=0.1.4",
]

# Optional, never required. Tracing imports langfuse lazily and degrades to a no-op
# when it is absent, so CI does not install this and the suite passes without it.
[project.optional-dependencies]
tracing = ["langfuse>=2.50"]
# Read-only Azure access for MODE=real. Only these packages: no management client
# capable of mutating a resource is listed, and a test asserts none is imported.
azure = [
    "azure-identity>=1.19",
    "azure-mgmt-resourcegraph>=8.0",
    "azure-mgmt-costmanagement>=4.0",
    "azure-mgmt-monitor>=6.0",
    "azure-mgmt-advisor>=9.0",
    "azure-mgmt-reservations>=2.0",
]
# The MCP tool server.
mcp = ["fastmcp>=2.0"]
# PDF rendering. The Markdown report needs no extras and is always available, so a
# missing toolchain costs a format rather than the deliverable. ReportLab is pure
# Python with no system libraries behind it -- WeasyPrint looks better and needs Pango
# and Cairo installed, which makes "render the client's PDF" a platform problem on a
# laptop. Nothing here touches the network: a document containing a client's spend
# must not be assembled by a hosted service.
reports = ["reportlab>=4.2"]
# Real language-model backends. FakeLLM stays the default and CI installs neither.
llm = ["openai>=1.50", "google-genai>=1.0"]
# Durable memory in PostgreSQL. The default memory store is SQLite from the standard
# library, so CI and the demo install nothing for memory to work.
memory = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
# Everything a real read-only run needs.
real = [
    "costsentinel[azure]",
    "costsentinel[mcp]",
    "costsentinel[llm]",
    "costsentinel[memory]",
    "costsentinel[reports]",
]

[project.scripts]
costsentinel = "costsentinel.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "pyright>=1.1.390",
    # Required by fastapi.testclient; declared rather than relied on transitively.
    "httpx>=0.27",
    # Tests parse docker-compose.yml to assert what the stack wires up. Text
    # matching would pass on a commented-out line, which is exactly the mistake
    # those assertions exist to catch. Dev-only: nothing in src imports yaml.
    "pyyaml>=6.0",
    # An independent JOSE implementation, so the card's JWS is checked by code we did
    # not write. Dev-only: nothing in src imports jwt.
    "pyjwt>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `evals` ships alongside the package rather than being a repository-only tool.
# CLAUDE.md section 8 calls evaluations "a first-class deliverable, not an
# afterthought", and `costsentinel eval` is the command that makes the product's
# claims checkable -- so anyone who installs CostSentinel can verify them. It costs
# a few tens of kilobytes of labelled JSON.
packages = ["src/costsentinel", "evals"]
# The price catalogue, the reference corpus and the labelled datasets are data these
# packages read at runtime, so they ship rather than being dev-only files.
artifacts = [
    "src/costsentinel/providers/data/*.json",
    "src/costsentinel/guardrails/data/*.json",
    "src/costsentinel/memory/data/*.md",
    "evals/datasets/*.json",
]

# --------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez -- timezone-aware datetimes only
    "T20",  # flake8-print -- no stray print() in library code
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "TID",  # flake8-tidy-imports
    "PL",   # pylint
    "RUF",  # ruff-specific
    "D",    # pydocstyle -- module docstrings are mandated by CLAUDE.md
    "ANN",  # flake8-annotations -- typed everywhere
    "S",    # flake8-bandit
]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "ANN401", # Any is sometimes unavoidable at a serialisation edge
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # asserts are the point
    "D101",    # test-local helper classes document themselves by name
    "D102",    # ditto for their methods
    "D103",    # ditto for test functions
    "D107",    # ditto for a test double's constructor
    "PLR2004", # magic values are fine in assertions
    "PLC0415", # a narrow import stays next to the one test that needs it
    "ARG001",  # pytest fixtures are requested by name, not always referenced
    "ARG002",  # ditto for signature-matching overrides in test doubles
    "SLF001",  # a test may reach into the private helper it specifically covers
]
"src/costsentinel/cli.py" = ["T201"] # the CLI is allowed to write to stdout
"scripts/**" = ["T201"]             # operator scripts report progress to the terminal

[tool.ruff.lint.pylint]
# Nodes, detectors and the sweep runner take their dependencies as keyword-only
# arguments, which is the injection seam that keeps them testable. PLR0913 guards
# against unreadable positional call sites, a concern keyword-only params already
# address, so the limit is raised rather than suppressed per site. Raised to 10 in
# Phase 4, when the memory store joined the provider, the model, the policy store,
# the tracer and the checkpointer as a seam the runner takes rather than reaches for.
#
# It stops at 10. When the embedder would have made eleven, the right answer was to
# notice that an embedder is derived from configuration rather than chosen by a
# caller, and not to raise this again. The next thing that wants an eleventh
# argument should be bundled, not accommodated.
max-args = 10
# Two functions are dispatch tables: the savings calculator maps an action to its
# arithmetic, and the supervisor maps a state to its next route. A flat series of
# guarded returns is the clearest possible form for both -- collapsing them into
# nested conditionals to satisfy a counter would make the routing logic harder to
# audit, which is the opposite of what it is for.
max-returns = 12

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# --------------------------------------------------------------------------
# pyright -- strict on src
# --------------------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
strict = ["src"]
typeCheckingMode = "standard"
useLibraryCodeForTypes = true
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

# --------------------------------------------------------------------------
# pytest / coverage
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=costsentinel",
    # The harness ships in the wheel, so it is measured like any other code.
    "--cov=evals",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=90",
]

[tool.coverage.run]
source = ["src/costsentinel", "evals"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.$",
]
